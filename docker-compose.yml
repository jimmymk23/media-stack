version: "3.9"
name: media-stack
services:

  # To use/enable VPN, Run this compose file with --profile=vpn. Its highly recommended to use VPN.
  vpn:
    ## Read https://github.com/qdm12/gluetun-wiki/tree/main/setup/providers for details on configuring VPN for your service provider.
    profiles: ["vpn"]
    container_name: vpn
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-nordvpn} # Valid values: nordvpn, expressvpn, protonvpn, surfshark or custom
      ## Switch protocol by changing VPN_TYPE in .env (openvpn or wireguard), then: docker compose --profile vpn up -d
      - VPN_TYPE=${VPN_TYPE:-openvpn}
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      ## WireGuard (ProtonVPN: private key from a WireGuard config generated at account.protonvpn.com -> Downloads -> WireGuard)
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}  # Optional for protonvpn; the "Address" from the config if set

      ## ProtonVPN port forwarding (NAT-PMP). For OpenVPN, OPENVPN_USER must end with "+pmp". Only P2P servers support it.
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING:-off}
      - PORT_FORWARD_ONLY=${VPN_PORT_FORWARDING:-off}
      ## Pushes the forwarded port into qBittorrent (needs "Bypass authentication for clients on localhost" enabled in qBittorrent WebUI options)
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:5080/api/v2/app/setPreferences 2>&1'

      ## For list of server countries, visit https://raw.githubusercontent.com/qdm12/gluetun/master/internal/storage/servers.json
      ## When VPN_SERVICE_PROVIDER is custom. Comment the below line
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Switzerland}
      - SERVER_CITIES=${SERVER_CITIES:-}  # Optional, e.g. New York
    
      # - FREE_ONLY=on  # Valid with protonvpn only. Value willbe set "on" if using free subscription provided by protonvpn

      ## Enable below if VPN_SERVICE_PROVIDER=custom
      # - VPN_TYPE=openvpn # or wireguard. 

      ## If VPN_TYPE is openvpn
      # - OPENVPN_CUSTOM_CONFIG=/gluetun/custom.conf

      ## If VPN_TYPE is wireguard. Replace below env variables as required.
      # - VPN_ENDPOINT_IP=1.2.3.4                                               # Replace with your wg endpoint ip or domain
      # - VPN_ENDPOINT_PORT=51820                                               # Replace with wg server port
      # - WIREGUARD_PUBLIC_KEY=wAUaJMhAq3NFutLHIdF8AN0B5WG8RndfQKLPTEDHal0=     # Replace with your wg public key
      # - WIREGUARD_PRIVATE_KEY=wOEI9rqqbDwnN8/Bpp22sVz48T71vJ4fYmFWujulwUU=    # Replace with your wg client private key
      # - WIREGUARD_PRESHARED_KEY=xOEI9rqqbDwnN8/Bpp22sVz48T71vJ4fYmFWujulwUU=  # Replaced with your wg pre-shared key
      # - WIREGUARD_ADDRESSES="10.64.222.21/32"                                 # Replace with wg address

    ## Enable volume if VPN_SERVICE_PROVIDER=custom and VPN_TYPE=openvpn is used
    # volumes:
      # - /yourpath/yourconfig.conf:/gluetun/config.conf:ro

    networks:
      - mynetwork

    devices:
      - /dev/net/tun:/dev/net/tun
      
    # Uncomment/enable below ports if VPN is used/enabled
    ports:
      # qbittorrent ports
      - 5080:5080
      - 6881:6881
      - 6881:6881/udp
      # prowlarr ports
      - 9696:9696
    volumes:
      - gluetun-data:/gluetun
    restart: "unless-stopped"

  ## Default credentials of qBittorrent - Username: admin password: adminadmin ##
  ## Change password after install from UI --> Tools --> Options --> WebUI ##
  qbittorrent:
    profiles: ["vpn", "no-vpn"]
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:5.2.3

    # Unomment below if vpn is enabled
    depends_on:               # Uncomment this line if vpn is enabled
      vpn:                   # Uncomment this line if vpn is enabled
        condition: service_healthy # Uncomment this line if vpn is enabled

    # Comment below lines if VPN is enabled
    # networks:               # Comment this line if vpn is enabled
    #   - mynetwork           # Comment this line if vpn is enabled

    # Uncomment below line if vpn is enabled
    network_mode: service:vpn

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - WEBUI_PORT=5080
      - UMASK=002
    volumes:
      - qbittorrent-config:/config
      - ${DATA_ROOT:-/Volumes/MediaServer/data}/torrents:/data/torrents

    ## Comment/Disable below ports if VPN is enabled
    # ports:
    #   - 5080:5080
    #   - 6881:6881
    #   - 6881:6881/udp
    restart: "unless-stopped"

  radarr:
    profiles: ["vpn", "no-vpn"]
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.3.0
    networks:
      # - mynetwork   # Comment this line if VPN is enabled
    ## Uncomment below lines if VPN is enabled
      mynetwork:
        ipv4_address: ${RADARR_STATIC_CONTAINER_IP} # It should be available IPv4 address in range of docker network `mynetwork` e.g. 172.20.0.2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - UMASK=002
    ports:
      - 7878:7878
    volumes:
      - radarr-config:/config
      - ${DATA_ROOT:-/Volumes/MediaServer/data}:/data
    restart: "unless-stopped"

  sonarr:
    profiles: ["vpn", "no-vpn"]
    image: linuxserver/sonarr:4.0.19
    container_name: sonarr
    networks:
      # - mynetwork   # Comment this line if VPN is enabled
    ## Uncomment below lines if VPN is enabled
      mynetwork:
        ipv4_address: ${SONARR_STATIC_CONTAINER_IP} # It should be available IPv4 address in range of docker network `mynetwork` e.g. 172.20.0.2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - UMASK=002
    volumes:
      - sonarr-config:/config
      - ${DATA_ROOT:-/Volumes/MediaServer/data}:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  prowlarr:
    profiles: ["vpn", "no-vpn"]
    container_name: prowlarr
    image: linuxserver/prowlarr:2.5.2

    # Uncomment below if vpn is enabled
    depends_on:               # Uncomment this line if vpn is enabled
      vpn:                   # Uncomment this line if vpn is enabled
        condition: service_healthy # Uncomment this line if vpn is enabled
    network_mode: service:vpn # Uncomment this line if vpn is enabled

    # networks:               # Comment this line if vpn is enabled
    #   - mynetwork           # Comment this line if vpn is enabled
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - prowlarr-config:/config

    # Comment below ports if VPN is enabled.
    # ports:
    #   - 9696:9696
    restart: unless-stopped

  recommendarr:
    profiles: ["recommendarr"]
    container_name: recommendarr
    image: tannermiddleton/recommendarr:v1.4.4
    networks:
      - mynetwork
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - PORT=3000
      - PUBLIC_URL=https://localhost:3000 # Change this public URL if you are accessing recommendarr on a domain
    volumes:
      - recommendarr-data:/app/server/data
    ports:
      - 3000:3000
    restart: unless-stopped

  seerr:
    profiles: ["vpn", "no-vpn"]
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    networks:
      - mynetwork
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PORT=5055
    volumes:
      - seerr-config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  jellyfin:
    profiles: ["vpn", "no-vpn"]
    image: linuxserver/jellyfin:10.11.11
    container_name: jellyfin
    networks:
      - mynetwork
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - UMASK=002
    volumes:
      - jellyfin-config:/config
      - ${DATA_ROOT:-/Volumes/MediaServer/data}/media:/data/media
  # devices:
   #  - /dev/videoN:/dev/videoN # Mount GPU device 
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 8920:8920
    restart: unless-stopped
  
  
  # ---------------------------------------------------------------------------
  # Automation add-ons (all in the vpn/no-vpn profiles, so `mediactl up` starts them).
  # They need RADARR_API_KEY / SONARR_API_KEY in .env (Settings > General > API Key).
  # ---------------------------------------------------------------------------

  # FlareSolverr: solves Cloudflare challenges for Prowlarr indexers.
  # Shares gluetun's network namespace like Prowlarr does, so in Prowlarr use
  # http://localhost:8191 (Settings > Indexers > Add Indexer Proxy > FlareSolverr, tag "flaresolverr").
  # VPN mode only: it has no port of its own because it lives inside the vpn container's network.
  flaresolverr:
    profiles: ["vpn"]
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    depends_on:
      vpn:
        condition: service_healthy
    network_mode: service:vpn
    environment:
      - TZ=UTC
      - LOG_LEVEL=info
    restart: unless-stopped

  # Recyclarr: syncs TRaSH Guides quality profiles and custom formats into Radarr/Sonarr.
  # First start writes a template to /config/recyclarr.yml; edit it, then run:
  #   docker exec recyclarr recyclarr sync
  # (it also re-syncs on CRON_SCHEDULE). See "Configure Recyclarr" in the README.
  recyclarr:
    profiles: ["vpn", "no-vpn"]
    container_name: recyclarr
    image: ghcr.io/recyclarr/recyclarr:8.7.3
    depends_on:
      - radarr
      - sonarr
    networks:
      - mynetwork
    environment:
      - TZ=UTC
      - CRON_SCHEDULE=@daily
      - RECYCLARR_CREATE_CONFIG=true
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
    volumes:
      - recyclarr-config:/config
    restart: unless-stopped

  # Bazarr: subtitles for everything Radarr/Sonarr manage.
  # It must see the same media paths as Radarr/Sonarr (/data/media/...); archived titles
  # (/data/archive) are added by docker-compose.archive.yml.
  bazarr:
    profiles: ["vpn", "no-vpn"]
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:1.6.2
    depends_on:
      - radarr
      - sonarr
    networks:
      - mynetwork
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - UMASK=002
    volumes:
      - bazarr-config:/config
      - ${DATA_ROOT:-/Volumes/MediaServer/data}/media:/data/media
    ports:
      - 6767:6767
    restart: unless-stopped

  # Unpackerr: extracts RAR/ZIP releases so Radarr/Sonarr can import them.
  # Needs the same /data/torrents path as qBittorrent, Radarr and Sonarr.
  unpackerr:
    profiles: ["vpn", "no-vpn"]
    container_name: unpackerr
    image: ghcr.io/unpackerr/unpackerr:0.16.1
    user: "1000:1000"
    depends_on:
      - radarr
      - sonarr
    networks:
      - mynetwork
    environment:
      - TZ=UTC
      - UN_FILE_MODE=0664
      - UN_DIR_MODE=0775
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY:-}
      - UN_RADARR_0_PATHS_0=/data/torrents/movies
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY:-}
      - UN_SONARR_0_PATHS_0=/data/torrents/tv
    volumes:
      - ${DATA_ROOT:-/Volumes/MediaServer/data}/torrents:/data/torrents
    restart: unless-stopped

  # Maintainerr: rule-based cleanup of unwatched/old media (replaces cleanmyarr).
  # Configure at http://localhost:6246 (Settings: Jellyfin, Radarr, Sonarr, Seerr).
  maintainerr:
    profiles: ["vpn", "no-vpn"]
    container_name: maintainerr
    image: ghcr.io/maintainerr/maintainerr:3.30.1
    depends_on:
      - radarr
      - sonarr
      - jellyfin
    networks:
      - mynetwork
    environment:
      - TZ=UTC
    volumes:
      - maintainerr-data:/opt/data
    ports:
      - 6246:6246
    restart: unless-stopped

volumes:
  gluetun-data:
  radarr-config:
  sonarr-config:
  prowlarr-config:
  jellyfin-config:
  qbittorrent-config:
  seerr-config:
  recommendarr-data:
  recyclarr-config:
  bazarr-config:
  maintainerr-data:

networks:
  mynetwork:
    external: true